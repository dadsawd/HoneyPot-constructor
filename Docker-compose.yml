# 🍌 Убран устаревший атрибут version:, чтобы Docker Compose не ругался при старте предупреждениями
# Создаем две изолированные сети
networks:
  management-net: # Внутренний закрытый контур (Бэк Центра + База)
  honeynet:       # Внешний грязный контур DMZ (Ловушки + Бэк Центра для приема логов)

services:
  #reverse-proxy:
      #image: nginx:alpine
      #ports:
      #  - "80:80"
      #volumes:
      #  - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      #networks:
      #  - honeynet
      #depends_on:
      #  - fake-web-service

  fake-web-service:
    # 🍌 Исправлен путь сборки на корневую папку проекта, чтобы Docker не выдавал ошибку "path not found"
    image: universal-pot-image:latest
    ports:
      - "8084:8000"
    networks:
      - honeynet
    deploy:
      resources:
        limits:
          memory: 150M

  # Оркестратор (Центральный бэкенд)
  center-backend:
    build: ./app
    ports:
      - "8000:8000" # Порт для связи и API Дашборда
    networks:
      - management-net
      - honeynet # 🍌 КРИТИЧНО: Сидит в обеих сетях, чтобы принимать телеметрию от ловушек
    depends_on:
      - database-db
    environment:
      - DB_URL=postgresql://user:password@database-db:5432/honeypot_db
    deploy:
      resources:
        limits:
          memory: 200M

  # База данных PostgreSQL (готовый образ из Docker Hub)
  database-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: honeypot_db
    volumes:
      - pgdata:/var/lib/postgresql/data # Храним данные базы на диске вечно
    networks:
      - management-net # База полностью изолирована от сети ловушек!
    deploy:
      resources:
        limits:
          memory: 300M

  # Фронтенд Дашборда
  dashboard-frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80" # Открываем дашборд на порту 3000 твоего ПК
    networks:
      - management-net


  # ПАРК ЛОВУШЕК
  # 🍌 Заменили несуществующие локальные сборки pots/* на готовый универсальный образ universal-pot-image:latest,
  # который поднимает твой contructor.py на нужном порту внутри контейнера (порт 8000 внутри мапится на внешние порты)

  # Ловушка 1: SQL-Инъекции
  sql-injection-pot:
    image: universal-pot-image:latest
    ports:
      - "8081:8000"
    networks:
      - honeynet

  # Ловушка 2: XSS
  xss-pot:
    image: universal-pot-image:latest
    ports:
      - "8082:8000"
    networks:
      - honeynet

  # Ловушка 3: Брутфорс
  bruteforce-pot:
    image: universal-pot-image:latest
    ports:
      - "8083:8000"
    networks:
      - honeynet

# Объявляем постоянное хранилище для базы данных
volumes:
  pgdata: