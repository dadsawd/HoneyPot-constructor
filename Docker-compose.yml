version: '3.8'

# Создаем две изолированные сети
networks:
  management-net: # Внутренний закрытый контур (Бэк Центра + База)
  honeynet:       # Внешний грязный контур DMZ (Ловушки + Бэк Центра для приема логов)

services:
  reverse-proxy: #reverse-proxy
      image: nginx:alpine
      ports:
        - "80:80"
      volumes:
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      networks:
        - honeynet
      depends_on:
        - fake-web-service
  fake-web-service: #фейк веб-сервис
    build: ./pots/web_service
    networks:
      - honeynet
    deploy:
      resources:
        limits:
          memory: 150M
  # Оркестратор
  center-backend:
    build: ./app
    ports:
      - "8000:8000" # Порт для связи и API Дашборда
    networks:
      - management-net
      - honeynet # КРИТИЧНО: Сидит в обеих сетях, чтобы принимать логи от ловушек
    depends_on:
      - database-db
    environment:
      - DB_URL=postgresql://user:password@database-db:5432/honeypot_db
    deploy:
      resources:
        limits:
          memory: 200M

  # База данных PostgreSQL (контейнер берется готовый из Docker Hub)
  database-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: honeypot_db
    volumes:
      - pgdata:/var/lib/postgresql/data # Храним данные базы на диске вечно
    networks:
      - management-net # База отрезана от сети ловушек! Хакер её не увидит
    deploy:
      resources:
        limits:
          memory: 300M

  # Фронтенд Дашборда
  dashboard-frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80" # Открываем дашборд на порту 3000 твоего компа
    networks:
      - management-net


  # ПАРК ЛОВУШЕК

  # Ловушка 1: SQL-Инъекции
  sql-injection-pot:
    build: ./pots/sqlinject
    ports:
      - "8081:80"
    networks:
      - honeynet

  # Ловушка 2: XSS
  xss-pot:
    build: ./pots/xssinjection
    ports:
      - "8082:80"
    networks:
      - honeynet

  # Ловушка 3: Брутфорс
  bruteforce-pot:
    build: ./pots/bruteforce
    ports:
      - "8083:80"
    networks:
      - honeynet

# Объявляем постоянное хранилище для базы данных
volumes:
  pgdata: