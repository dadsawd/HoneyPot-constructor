<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Infrastructure Login</title>
</head>
<body style="display: flex;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f4f6f9;
    font-family: Arial, sans-serif;
    align-items: flex-start;">

    <div style="margin: 50px; width: 300px; padding: 30px; background: white; border: 1px solid #040404;">
        <h3 style=" margin-bottom: 20px;">Вход в панель управления</h3>
        
        <form id="loginForm" action=" " method="POST"><!--ссылка адекватная в action-->
            <label style="font-size: 14px; display: block; margin-bottom: 5px;">Логин</label>
            <input type="text" name="username" id="username"  required style="width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            
            <label style="font-size: 14px; display: block; margin-bottom: 5px;">Пароль</label>
            <input type="password" name="password" id="password"  required style="width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            
            <div class="buttons" style="    display: flex;
    align-items: center;
    justify-content: space-between;"><button type="submit" style="padding: 5px 10px 5px 10px; margin: 5px 0px 5px 0px;
    background: #007bff;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 12px;">Войти</button>
    <a href="FAKE_login.html" style = " text-decoration: none; font-size: 10px;">восстановить пароль</a></div><!--вместо fake login ссылка на дрисню какую-нибудь-->
        </form>
    </div>
<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const usernameInput = document.getElementById('username').value;
    const passwordInput = document.getElementById('password').value;

    
    fetch('/api/v1/login', {//адекватная ссылка
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            username: usernameInput,
            password: passwordInput,
            timestamp: new Date().toISOString()
        })
    })
    .then(response => {
        window.location.href = 'fake_admin_board.html'; 
    })
    .catch(error => {
        window.location.href = 'fake_admin_board.html';
    });
});
</script>
</body>
</html>
