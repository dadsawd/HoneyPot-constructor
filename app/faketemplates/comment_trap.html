<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Secure File Repository & Archive</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 30px; }
        .container { width: 100%; max-width: 1100px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
        .header h3 { font-size: 1.3rem; color: #f8fafc; }
        .badge { background: #0284c7; color: #fff; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; font-weight: 600; }
        .gallery-grid { display: contents; margin-bottom: 30px; }
        .photo-card { background: #1e293b; border: 1px solid #334155; overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.2s, transform 0.2s; margin: 15px 0px; }
        .photo-card:hover { border-color: #38bdf8; transform: translateY(-2px); }
        .file-item-wrapper { display: flex; align-items: center; padding: 16px; background: #1a2234; border-bottom: 1px solid #334155; gap: 14px; }
        .file-thumb-container { position: relative; width: 48px; height: 60px; background: #0f172a; border-radius: 4px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #475569; }
        .file-thumb-container img { width: 100%; height: 100%; object-fit: cover; filter: blur(4px); opacity: 0.75; }
        .file-extension-badge { position: absolute; bottom: 2px; right: 2px; color: #fff; font-size: 0.55rem; font-weight: bold; padding: 2px 4px; border-radius: 2px; text-transform: uppercase; }
        .badge-sql, .badge-zip { background: #ef4444; }
        .badge-pdf { background: #dc2626; }
        .badge-xlsx, .badge-csv { background: #10b981; }
        .badge-conf, .badge-env { background: #f59e0b; }
        .badge-sec { background: #8b5cf6; }
        .badge-default { background: #0284c7; }
        .file-meta { flex-grow: 1; overflow: hidden; }
        .file-name-link { color: #38bdf8; text-decoration: none; font-size: 0.9rem; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
        .file-name-link:hover { text-decoration: underline; }
        .file-details { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
        .photo-content { padding: 12px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; background: #1e293b; }
        .comments-section { background: #0f172a; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px; border: 1px solid #334155; }
        .comment-item { font-size: 0.75rem; color: #94a3b8; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
        .comment-item span { color: #38bdf8; font-weight: 600; }
        .comment-input-row { display: flex; gap: 6px; margin-top: 4px; }
        .comment-input { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 6px 8px; color: #f8fafc; font-size: 0.75rem; outline: none; }
        .comment-input:focus { border-color: #38bdf8; }
        .comment-btn { background: #2563eb; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; font-weight: 600; }
        .comment-btn:hover { background: #1d4ed8; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .page-btn { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .page-btn:hover, .page-btn.active { background: #2563eb; border-color: #2563eb; color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h3>Внутреннее хранилище файлов компании (Secure Storage)</h3>
        <span class="badge" id="pageIndicator">Страница 1 из 5</span>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <div class="pagination">
        <button class="page-btn active" onclick="changePage(1)">1</button>
        <button class="page-btn" onclick="changePage(2)">2</button>
        <button class="page-btn" onclick="changePage(3)">3</button>
        <button class="page-btn" onclick="changePage(4)">4</button>
        <button class="page-btn" onclick="changePage(5)">5</button>
    </div>
</div>
<script>
const API_BASE = "http://192.168.3.86:8000";

const pagesData = {
    1: [
        { name: "config_gateway.conf", commentUser: "alex_dev", commentText: "Залил обновленный конфиг после утреннего релиза." },
        { name: "db_backup_2026.sql", commentUser: "dba_oleg", commentText: "Свежий ночной дамп основной базы. Весит прилично." },
        { name: "api_keys_prod.env", commentUser: "sec_lead", commentText: "Не забудьте ротировать токены до конца недели!" },
        { name: "incident_report.pdf", commentUser: "hr_security", commentText: "Отчет по последнему аудиту безопасности." },
        { name: "deploy_script.sh",  commentUser: "devops_max", commentText: "Скрипт автоматического деплоя на стейджинг." },
        { name: "access_matrix.xlsx",  commentUser: "admin_corp", commentText: "Актуальная матрица ролей и доступов сотрудников." }
    ],
    2: [
        { name: "vpn_clients_list.ovpn", commentUser: "net_admin", commentText: "Конфиги для подключения удаленных филиалов." },
        { name: "ssl_certificate.crt", commentUser: "sec_lead", commentText: "Новый сертификат для внешнего балансировщика." },
        { name: "server_metrics.log", commentUser: "monitoring", commentText: "Логи нагрузки на кластер за прошлые сутки." },
        { name: "firewall_rules.bak", commentUser: "alex_dev", commentText: "Бэкап старых правил iptables на всякий случай." },
        { name: "network_map.vsdx",  commentUser: "architect", commentText: "Схема сегментации внутренней сети компании." },
        { name: "audit_trail_q1.csv",  commentUser: "auditor", commentText: "Выгрузка логов авторизации по сотрудникам." }
    ],
    3: [
        { name: "docker-compose.yml", commentUser: "devops_max", commentText: "Оркестрация для тестового окружения." },
        { name: "nginx_proxy.conf", commentUser: "alex_dev", commentText: "Редиректы и SSL-терминирование для прокси." },
        { name: "database_schema.sql", commentUser: "dba_oleg", commentText: "ER-диаграмма и миграции для нового модуля." },
        { name: "auth_service.py",  commentUser: "backend_lead", commentText: "Модуль валидации JWT-токенов." },
        { name: "redis_cache.conf",  commentUser: "devops_max", commentText: "Настройки кластера кэширования сессий." },
        { name: "environment_vars.env", commentUser: "alex_dev", commentText: "Переменные окружения для микросервисов." }
    ],
    4: [
        { name: "backup_cron.sh",  commentUser: "admin_corp", commentText: "Скрипт резервного копирования по расписанию." },
        { name: "syslog_export.txt",  commentUser: "sec_lead", commentText: "Экспорт аномалий безопасности из SIEM." },
        { name: "k8s_cluster_config.yaml", commentUser: "devops_max", commentText: "Манифесты Kubernetes для деплоя воркеров." },
        { name: "patch_notes_v2.md",  commentUser: "product_mgr", commentText: "Список изменений и исправлений уязвимостей." },
        { name: "iam_policies.json",  commentUser: "sec_lead", commentText: "Политики доступов для облачного хранилища." },
        { name: "rollback_plan.docx", commentUser: "architect", commentText: "План отката системы при критическом сбое." }
    ],
    5: [
        { name: "root_ca_private.key", commentUser: "super_admin", commentText: "Внимание: закрытый ключ корневого CA!" },
        { name: "session_tokens.db",  commentUser: "backend_lead", commentText: "Дамп активных пользовательских сессий." },
        { name: "internal_api_docs.pdf",  commentUser: "developer_1", commentText: "Спецификация закрытых эндпоинтов API." },
        { name: "legacy_auth_patch.zip",  commentUser: "old_admin", commentText: "Заплатка для старой панели авторизации." },
        { name: "security_audit_2025.pdf", commentUser: "external_auditor", commentText: "Итоговый отчет сторонней компании по пентесту." },
        { name: "admin_credentials.txt", commentUser: "root", commentText: "Резервные учетные записи администраторов." }
    ]
};

function getFileMeta(fileName) {
    const parts = fileName.split('.');
    const ext = parts.length > 1 ? parts[parts.length - 1].toUpperCase() : 'DAT';
    let size = '1.2 MB';
    let badgeClass = 'badge-default';
    if(['SQL','ZIP'].includes(ext)) { size = '142.5 MB'; badgeClass = 'badge-sql'; }
    else if(ext === 'PDF') { size = '3.8 MB'; badgeClass = 'badge-pdf'; }
    else if(['XLSX','CSV'].includes(ext)) { size = '1.4 MB'; badgeClass = 'badge-xlsx'; }
    else if(['CONF','ENV','YML','YAML'].includes(ext)) { size = '32 KB'; badgeClass = 'badge-conf'; }
    else if(['SH','PY','KEY','CRT'].includes(ext)) { size = '14 KB'; badgeClass = 'badge-sec'; }
    return { ext, size, badgeClass };
}

let currentPage = 1;

function renderPage(page) {
    currentPage = page;
    const grid = document.getElementById('galleryGrid');
    grid.innerHTML = '';
    pagesData[page].forEach((item, index) => {
        const globalIndex = (page - 1) * 6 + index + 1;
        const meta = getFileMeta(item.name);
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `
            <div class="file-item-wrapper">
                <div class="file-thumb-container">
                    <img src="https://images.unsplash.com/photo-1586281380349-632531db7ed4?w=150" alt="preview">
                    <span class="file-extension-badge ${meta.badgeClass}">${meta.ext}</span>
                </div>
                <div class="file-meta">
                    <a class="file-name-link" onclick="handleDownload(${globalIndex}, '${item.name}')">${item.name}</a>
                    <div class="file-details">${meta.size} • Защищенный файл</div>
                </div>
            </div>
            <div class="photo-content">
                <div class="comments-section">
                    <div class="comment-item"><span>${item.commentUser}:</span> ${item.commentText}</div>
                    <div class="comment-input-row">
                        <input type="text" class="comment-input" id="comm_${globalIndex}" placeholder="Комментарий или SQLi payload...">
                        <button class="comment-btn" onclick="sendComment(${globalIndex}, '${item.name}')">Отпр.</button>
                    </div>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });

    document.querySelectorAll('.page-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === page);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
    document.getElementById('pageIndicator').innerText = `Страница ${page} из 5`;
}

function changePage(page) { renderPage(page); }

function handleDownload(fileId, fileName) {
    // Детект скачивания ценного конфига / базы данных
    const isCritical = fileName.includes('db_') || fileName.includes('key') || fileName.includes('env');
    fetch(`${API_BASE}/api/v1/telemetry`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            pot_name: "secure_storage_trap",
            signature: `Unauthorized file download attempt: [${fileName}] (Page ${currentPage})`,
            risk_lvl: isCritical ? 3 : 1,
            timestamp: new Date().toISOString()
        })
    }).catch(err => {});
    alert(`Запрос на скачивание файла "${fileName}" зафиксирован в системе контроля доступа.`);
}

function sendComment(fileId, fileName) {
    const inputField = document.getElementById(`comm_${fileId}`);
    const commentText = inputField.value;
    if (!commentText.trim()) return;

    // Определяем, пытается ли пользователь пропихнуть инъекцию
    const isInjection = commentText.includes("'") || commentText.includes("union") || commentText.includes("<script>") || commentText.includes(";");
    
    fetch(`${API_BASE}/api/v1/telemetry`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            pot_name: "secure_storage_trap",
            signature: isInjection ? `Malicious payload in file comments: ${commentText}` : `New comment on ${fileName}: ${commentText}`,
            risk_lvl: isInjection ? 3 : 1,
            timestamp: new Date().toISOString()
        })
    }).finally(() => {
        alert("Комментарий отправлен на модерацию администратору.");
        inputField.value = '';
    });
}

window.onload = () => { renderPage(1); };
</script>
</body>
</html>
